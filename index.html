<!DOCTYPE html>
<html lang="es" class="bg-gray-900">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Analysis Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@4.4.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-button-active { background-color: rgb(99 102 241); color: white; }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid rgb(129 140 248);
      border-radius: 9999px;
      width: 1rem;
      height: 1rem;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .collapse-content { display: none; }
    .collapse-open .collapse-content { display: block; }
  </style>
</head>
<body class="bg-gray-900 text-gray-300">
  <div class="fixed left-0 top-0 h-screen w-1/5 bg-gray-800 border-r border-gray-700 overflow-y-auto p-4 space-y-6">
    <div>
      <h1 class="text-white text-2xl font-bold">Trading Analysis Pro</h1>
      <p class="text-sm text-gray-400">Dashboard integral para acciones y criptomonedas</p>
    </div>

    <section class="space-y-3">
      <h2 class="text-xl font-semibold text-white">Mi Watchlist</h2>
      <div class="grid grid-cols-2 gap-2">
        <button id="save-project" class="bg-indigo-600 hover:bg-indigo-500 transition text-white rounded-lg px-3 py-2 text-sm">Guardar Proyecto</button>
        <div>
          <input type="file" id="load-project-input" class="hidden" accept="application/json" />
          <button id="load-project" class="w-full bg-gray-700 hover:bg-gray-600 transition text-white rounded-lg px-3 py-2 text-sm">Cargar Proyecto</button>
        </div>
      </div>
    </section>

    <section class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-400 uppercase">API FMP</h3>
      <div class="space-y-1 text-sm">
        <label class="flex items-center gap-2"><input type="radio" name="fmp-api" value="API_1" class="text-indigo-500" checked> API 1</label>
        <label class="flex items-center gap-2"><input type="radio" name="fmp-api" value="API_2" class="text-indigo-500"> API 2</label>
      </div>
      <h3 class="text-sm font-semibold text-gray-400 uppercase mt-3">Modelo Gemini</h3>
      <div class="space-y-1 text-sm">
        <label class="flex items-center gap-2"><input type="radio" name="gemini-model" value="gemini-1.5-flash-latest" class="text-indigo-500" checked> 1.5 Flash (Rápido)</label>
        <label class="flex items-center gap-2"><input type="radio" name="gemini-model" value="gemini-1.5-pro-latest" class="text-indigo-500"> 1.5 Pro (Avanzado)</label>
      </div>
    </section>

    <section class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-400 uppercase">Añadir símbolo</h3>
      <div class="flex gap-2">
        <input id="symbol-input" type="text" placeholder="Ej. AAPL" class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        <button id="add-symbol" class="bg-indigo-600 hover:bg-indigo-500 transition text-white rounded-lg px-3 py-2 text-lg">+</button>
      </div>
    </section>

    <section class="space-y-2">
      <button id="refresh-prices" class="w-full bg-gray-700 hover:bg-gray-600 transition text-white rounded-lg px-3 py-2 flex items-center justify-center gap-2">
        <span>Actualizar Precios (FMP)</span>
        <span id="refresh-loader" class="hidden loader"></span>
      </button>
      <button id="global-ai" class="w-full bg-indigo-600 hover:bg-indigo-500 transition text-white rounded-lg px-3 py-2 flex items-center justify-center gap-2">
        <span>Analizar con IA (Gemini)</span>
        <span id="global-ai-loader" class="hidden loader"></span>
      </button>
    </section>

    <section>
      <ul id="watchlist" class="space-y-2"></ul>
    </section>
  </div>

  <main class="ml-[20%] w-4/5 min-h-screen bg-gray-900 p-6">
    <nav class="bg-gray-800 rounded-lg p-2 flex gap-2 mb-6">
      <button data-view="dashboard" class="nav-button flex-1 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-700">Dashboard</button>
      <button data-view="chart" class="nav-button flex-1 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-700">Gráfico Detallado</button>
      <button data-view="simulator" class="nav-button flex-1 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-700">Simulador</button>
      <button data-view="reports" class="nav-button flex-1 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-700">Explorador IA</button>
      <button data-view="history" class="nav-button flex-1 rounded-lg px-3 py-2 text-sm font-medium hover:bg-gray-700">Historial</button>
    </nav>

    <section id="view-dashboard" class="space-y-4"></section>
    <section id="view-chart" class="hidden space-y-4"></section>
    <section id="view-simulator" class="hidden space-y-4"></section>
    <section id="view-reports" class="hidden space-y-4"></section>
    <section id="view-history" class="hidden space-y-4"></section>
  </main>

  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-6 z-50">
    <div class="bg-gray-800 rounded-lg shadow-xl max-w-3xl w-full max-h-full overflow-y-auto">
      <div class="flex justify-between items-center px-6 py-4 border-b border-gray-700">
        <h3 class="text-lg font-semibold text-white">Informe Completo</h3>
        <button id="modal-close" class="text-gray-400 hover:text-white text-2xl">&times;</button>
      </div>
      <div id="modal-content" class="p-6 space-y-4 text-sm whitespace-pre-wrap"></div>
    </div>
  </div>

  <script>
    const API_KEYS = {
      API_1: '8WdhV0NRTNrNzsW6oOrLeaOdUBfP9Ytk',
      API_2: 'NAyx0QgFN6dwwwTxGwpFZdcI0CbflBoV'
    };

    let appState = {
      watchlist: ['AAPL', 'GOOG', 'MSFT', 'ETH'],
      analysisHistory: {},
      activeView: 'dashboard',
      selectedSymbol: null,
      marketDataCache: {},
      simulatorOpportunities: [],
      weeklyReports: [],
      investmentAmount: 1000,
      selectedFmpApiKey: 'API_1',
      selectedGeminiModel: 'gemini-1.5-flash-latest',
      chartSettings: {
        timeframe: '1A',
        indicators: { sma: true, volume: true, macd: true, rsi: true }
      }
    };

    const loaders = {
      globalPrice: false,
      globalAI: false,
      cardFetch: {},
      cardAI: {},
      chartFetch: false,
      chartAI: false,
      simulator: {},
      reports: false
    };

    const formatterCurrency = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

    document.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      renderAll();
    });

    function setupEventListeners() {
      document.querySelectorAll('.nav-button').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeView = btn.dataset.view;
          renderViews();
        });
      });

      document.getElementById('add-symbol').addEventListener('click', () => {
        const input = document.getElementById('symbol-input');
        const symbol = input.value.trim().toUpperCase();
        if (!symbol) return;
        if (!appState.watchlist.includes(symbol)) {
          appState.watchlist.push(symbol);
          renderWatchlist();
          renderDashboard();
        }
        input.value = '';
      });

      document.getElementById('symbol-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('add-symbol').click();
        }
      });

      document.getElementById('refresh-prices').addEventListener('click', async () => {
        loaders.globalPrice = true;
        updateLoaderStates();
        await refreshAllMarketData();
        loaders.globalPrice = false;
        updateLoaderStates();
      });

      document.getElementById('global-ai').addEventListener('click', async () => {
        loaders.globalAI = true;
        updateLoaderStates();
        for (const symbol of appState.watchlist) {
          await runAiAnalysis(symbol);
        }
        loaders.globalAI = false;
        updateLoaderStates();
        renderDashboard();
      });

      document.getElementById('save-project').addEventListener('click', () => {
        const dataStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trading-analysis-pro-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('load-project').addEventListener('click', () => {
        document.getElementById('load-project-input').click();
      });

      document.getElementById('load-project-input').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          appState = { ...appState, ...parsed };
          renderAll();
        } catch (error) {
          alert('No se pudo cargar el proyecto: ' + error.message);
        }
      });

      document.querySelectorAll('input[name="fmp-api"]').forEach(radio => {
        radio.addEventListener('change', () => {
          appState.selectedFmpApiKey = radio.value;
        });
      });

      document.querySelectorAll('input[name="gemini-model"]').forEach(radio => {
        radio.addEventListener('change', () => {
          appState.selectedGeminiModel = radio.value;
        });
      });
    }

    function renderAll() {
      renderWatchlist();
      renderViews();
    }

    function renderViews() {
      document.querySelectorAll('.nav-button').forEach(btn => {
        btn.classList.toggle('nav-button-active', btn.dataset.view === appState.activeView);
      });

      const sections = ['dashboard', 'chart', 'simulator', 'reports', 'history'];
      sections.forEach(id => {
        document.getElementById(`view-${id}`).classList.toggle('hidden', appState.activeView !== id);
      });

      switch (appState.activeView) {
        case 'dashboard':
          renderDashboard();
          break;
        case 'chart':
          renderChartView();
          break;
        case 'simulator':
          renderSimulator();
          break;
        case 'reports':
          renderReports();
          break;
        case 'history':
          renderHistory();
          break;
      }
    }

    function renderWatchlist() {
      const list = document.getElementById('watchlist');
      list.innerHTML = '';
      if (appState.watchlist.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = 'Sin símbolos en la watchlist.';
        empty.className = 'text-sm text-gray-500';
        list.appendChild(empty);
        return;
      }

      appState.watchlist.forEach(symbol => {
        const li = document.createElement('li');
        li.className = `flex items-center justify-between bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm cursor-pointer transition ${appState.selectedSymbol === symbol ? 'bg-indigo-600 text-white' : 'hover:bg-gray-700'}`;
        const span = document.createElement('span');
        span.textContent = symbol;
        span.addEventListener('click', () => {
          appState.selectedSymbol = symbol;
          appState.activeView = 'chart';
          renderViews();
        });

        const remove = document.createElement('button');
        remove.className = 'text-gray-400 hover:text-red-400 text-lg';
        remove.innerHTML = '&times;';
        remove.addEventListener('click', (event) => {
          event.stopPropagation();
          appState.watchlist = appState.watchlist.filter(s => s !== symbol);
          if (appState.selectedSymbol === symbol) {
            appState.selectedSymbol = null;
          }
          renderWatchlist();
          renderDashboard();
        });

        li.appendChild(span);
        li.appendChild(remove);
        list.appendChild(li);
      });
    }

    function updateLoaderStates() {
      document.getElementById('refresh-loader').classList.toggle('hidden', !loaders.globalPrice);
      document.getElementById('global-ai-loader').classList.toggle('hidden', !loaders.globalAI);
    }

    async function refreshAllMarketData() {
      const promises = appState.watchlist.map(symbol => fetchMarketData(symbol));
      await Promise.all(promises);
      renderDashboard();
      if (appState.selectedSymbol) {
        await buildChartForSymbol(appState.selectedSymbol);
      }
    }

    function getFmpKey() {
      return API_KEYS[appState.selectedFmpApiKey] || API_KEYS.API_1;
    }

    async function fetchJson(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        console.error('Error fetching', url, error);
        throw error;
      }
    }

    async function fetchMarketData(symbol) {
      try {
        const key = getFmpKey();
        const quoteUrl = `https://financialmodelingprep.com/api/v3/quote/${symbol}?apikey=${key}`;
        const historyUrl = `https://financialmodelingprep.com/api/v3/historical-chart/1day/${symbol}?apikey=${key}`;
        const history4hUrl = `https://financialmodelingprep.com/api/v3/historical-chart/4hour/${symbol}?apikey=${key}`;

        const [quoteData, historyData, history4hData] = await Promise.all([
          fetchJson(quoteUrl),
          fetchJson(historyUrl),
          fetchJson(history4hUrl).catch(err => ({ error: err.message }))
        ]);

        const quote = quoteData?.[0] || null;
        if (!quote) throw new Error('Sin datos de cotización.');

        appState.marketDataCache[symbol] = {
          price: quote.price ?? quote.c ?? null,
          changesPercentage: quote.changesPercentage ?? quote.changePercent ?? 0,
          fullHistory: Array.isArray(historyData) ? historyData : [],
          history4H: Array.isArray(history4hData) ? history4hData : null,
          lastUpdated: new Date().toISOString()
        };
        return appState.marketDataCache[symbol];
      } catch (error) {
        appState.marketDataCache[symbol] = { error: error.message, lastUpdated: new Date().toISOString() };
        return null;
      }
    }

    function renderDashboard() {
      const container = document.getElementById('view-dashboard');
      container.innerHTML = '';
      if (appState.watchlist.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-500">Agrega símbolos para iniciar el análisis.</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid gap-4 md:grid-cols-2 xl:grid-cols-3';
      appState.watchlist.forEach(symbol => {
        grid.appendChild(createSymbolCard(symbol));
      });
      container.appendChild(grid);
    }

    function createSymbolCard(symbol) {
      const card = document.createElement('div');
      card.className = 'bg-gray-800 rounded-lg p-4 space-y-4 border border-gray-700';

      const header = document.createElement('div');
      header.className = 'flex items-center justify-between';
      const title = document.createElement('h3');
      title.className = 'text-lg font-semibold text-white';
      title.textContent = symbol;
      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'text-gray-400 hover:text-indigo-400';
      reloadBtn.textContent = '🔄';
      reloadBtn.addEventListener('click', async () => {
        loaders.cardFetch[symbol] = true;
        renderDashboard();
        await fetchMarketData(symbol);
        loaders.cardFetch[symbol] = false;
        renderDashboard();
      });
      header.appendChild(title);
      header.appendChild(reloadBtn);
      card.appendChild(header);

      const recommendation = getLatestAnalysis(symbol)?.recommendation ?? 'Sin Análisis';
      const recBadge = document.createElement('span');
      recBadge.className = `inline-flex items-center px-2 py-1 rounded-full text-xs font-semibold ${getRecommendationBadgeClasses(recommendation)}`;
      recBadge.textContent = recommendation.toUpperCase();
      card.appendChild(recBadge);

      const content = document.createElement('div');
      if (loaders.cardFetch[symbol]) {
        content.innerHTML = '<div class="flex items-center gap-2 text-sm text-gray-400"><span class="loader"></span> Actualizando datos...</div>';
      } else {
        const data = appState.marketDataCache[symbol];
        if (!data || data.error) {
          content.innerHTML = `<div class="space-y-2"><p class="text-sm text-red-400">No se pudo cargar la información: ${data?.error || 'Sin datos.'}</p><button class="bg-red-500 hover:bg-red-400 text-white rounded-lg px-3 py-2 text-sm" data-symbol="${symbol}">Reintentar</button></div>`;
          setTimeout(() => {
            content.querySelector('button')?.addEventListener('click', async () => {
              loaders.cardFetch[symbol] = true;
              renderDashboard();
              await fetchMarketData(symbol);
              loaders.cardFetch[symbol] = false;
              renderDashboard();
            });
          });
        } else {
          const price = data.price ? formatterCurrency.format(data.price) : 'N/D';
          const change = data.changesPercentage ?? 0;
          const changeColor = change >= 0 ? 'text-green-400' : 'text-red-400';
          content.innerHTML = `
            <div class="flex items-center justify-between">
              <div>
                <p class="text-2xl font-bold text-white">${price}</p>
                <p class="text-sm ${changeColor}">${change.toFixed(2)}%</p>
              </div>
              <canvas id="spark-${symbol}" class="h-16"></canvas>
            </div>
            <div class="grid grid-cols-2 gap-3 text-xs text-gray-400">
              <div>
                <p class="text-gray-500">Tipo Análisis</p>
                <p class="text-gray-200">${getLatestAnalysis(symbol)?.type ?? 'No disponible'}</p>
              </div>
              <div>
                <p class="text-gray-500">Confianza IA</p>
                <p class="text-gray-200">${getLatestAnalysis(symbol)?.confidence ?? 'Sin datos'}</p>
              </div>
            </div>`;
          setTimeout(() => drawSparkline(symbol, data.fullHistory));
        }
      }
      card.appendChild(content);

      const actions = document.createElement('div');
      actions.className = 'flex flex-wrap gap-2 text-sm';
      const analyzeBtn = document.createElement('button');
      analyzeBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-3 py-2 flex items-center justify-center gap-2';
      analyzeBtn.innerHTML = '<span>🔄 Analizar con IA</span>';
      if (loaders.cardAI[symbol]) {
        analyzeBtn.innerHTML = '<span class="loader"></span><span>Analizando...</span>';
      }
      analyzeBtn.addEventListener('click', async () => {
        loaders.cardAI[symbol] = true;
        renderDashboard();
        await runAiAnalysis(symbol);
        loaders.cardAI[symbol] = false;
        renderDashboard();
      });

      const simulatorBtn = document.createElement('button');
      simulatorBtn.className = 'px-3 py-2 rounded-lg bg-green-600 hover:bg-green-500 text-white';
      simulatorBtn.textContent = '🚀';
      simulatorBtn.addEventListener('click', () => {
        if (!appState.simulatorOpportunities.includes(symbol)) {
          appState.simulatorOpportunities.push(symbol);
        }
        appState.activeView = 'simulator';
        renderViews();
      });

      actions.appendChild(analyzeBtn);
      actions.appendChild(simulatorBtn);
      card.appendChild(actions);

      return card;
    }
    function getRecommendationBadgeClasses(rec) {
      switch ((rec || '').toLowerCase()) {
        case 'compra':
          return 'bg-green-500/20 text-green-300 border border-green-500/40';
        case 'venta':
          return 'bg-red-500/20 text-red-300 border border-red-500/40';
        case 'mantener':
          return 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40';
        default:
          return 'bg-gray-700 text-gray-300 border border-gray-600';
      }
    }

    function drawSparkline(symbol, history) {
      if (!Array.isArray(history) || history.length === 0) return;
      const ctx = document.getElementById(`spark-${symbol}`);
      if (!ctx) return;
      const dataPoints = history.slice(0, 30).reverse();
      const data = dataPoints.map(item => ({ x: new Date(item.date), y: item.close }));
      if (ctx._chart) {
        ctx._chart.destroy();
      }
      ctx._chart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label: symbol,
            data,
            borderColor: 'rgb(129, 140, 248)',
            tension: 0.3,
            pointRadius: 0,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { type: 'time', display: false }, y: { display: false } },
          plugins: { legend: { display: false } }
        }
      });
    }

    function renderChartView() {
      const container = document.getElementById('view-chart');
      container.innerHTML = '';

      if (!appState.selectedSymbol) {
        container.innerHTML = '<div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center text-gray-400">Selecciona un símbolo en la watchlist para ver el análisis detallado.</div>';
        return;
      }

      const symbol = appState.selectedSymbol;
      const data = appState.marketDataCache[symbol];

      const header = document.createElement('div');
      header.className = 'bg-gray-800 rounded-lg border border-gray-700 p-4 space-y-4';
      header.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl text-white font-semibold">Análisis Detallado: ${symbol}</h2>
            <p class="text-sm text-gray-400">Última actualización: ${data?.lastUpdated ? new Date(data.lastUpdated).toLocaleString() : 'N/D'}</p>
          </div>
          <div class="text-right">
            <p class="text-3xl font-bold text-white">${data?.price ? formatterCurrency.format(data.price) : 'N/D'}</p>
            <p class="${(data?.changesPercentage ?? 0) >= 0 ? 'text-green-400' : 'text-red-400'} text-sm">${(data?.changesPercentage ?? 0).toFixed(2)}%</p>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="chart-refresh" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2 flex items-center gap-2">
            <span>Actualizar Datos</span>
            <span id="chart-refresh-loader" class="${loaders.chartFetch ? '' : 'hidden'} loader"></span>
          </button>
          <button id="chart-ai" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-4 py-2 flex items-center gap-2">
            <span>Analizar con IA</span>
            <span id="chart-ai-loader" class="${loaders.chartAI ? '' : 'hidden'} loader"></span>
          </button>
        </div>`;
      container.appendChild(header);

      document.getElementById('chart-refresh')?.addEventListener('click', async () => {
        loaders.chartFetch = true;
        document.getElementById('chart-refresh-loader').classList.remove('hidden');
        await fetchMarketData(symbol);
        await buildChartForSymbol(symbol, true);
        loaders.chartFetch = false;
        document.getElementById('chart-refresh-loader').classList.add('hidden');
        renderChartView();
      });

      document.getElementById('chart-ai')?.addEventListener('click', async () => {
        loaders.chartAI = true;
        document.getElementById('chart-ai-loader').classList.remove('hidden');
        await runAiAnalysis(symbol, true);
        loaders.chartAI = false;
        document.getElementById('chart-ai-loader').classList.add('hidden');
        renderChartView();
      });

      const analysisPanel = document.createElement('div');
      analysisPanel.className = 'grid md:grid-cols-2 gap-4';
      const latestAnalysis = getLatestAnalysis(symbol);

    function filterByTimeframe(history, timeframe) {
      if (!Array.isArray(history)) return [];
      const limitMap = { '1M': 21, '6M': 126, '1A': 252, '5A': 252 * 5 };
      if (timeframe === 'MAX') return history;
      const limit = limitMap[timeframe] || history.length;
      return history.slice(-limit);
    }

    function calculateSMA(data, period) {
      if (!Array.isArray(data) || data.length === 0) return [];
      const result = [];
      for (let i = period - 1; i < data.length; i++) {
        const slice = data.slice(i - period + 1, i + 1);
        const sum = slice.reduce((acc, val) => acc + (val.close || 0), 0);
        result.push({ date: data[i].date, value: sum / period });
      }
      return result;
    }

    function calculateEMA(values, period) {
      const k = 2 / (period + 1);
      let ema = values[0];
      const result = [ema];
      for (let i = 1; i < values.length; i++) {
        ema = values[i] * k + ema * (1 - k);
        result.push(ema);
      }
      return result;
    }

    function calculateMACD(values) {
      if (!Array.isArray(values) || values.length === 0) return { macd: [], signal: [], histogram: [] };
      const ema12 = calculateEMA(values, 12);
      const ema26 = calculateEMA(values, 26);
      const macd = ema12.map((v, idx) => v - (ema26[idx] || 0));
      const signal = calculateEMA(macd.slice(26), 9);
      const paddedSignal = Array(26).fill(null).concat(signal);
      const histogram = macd.map((v, idx) => v - (paddedSignal[idx] || 0));
      return { macd, signal: paddedSignal, histogram };
    }

    function calculateRSI(values, period = 14) {
      if (!Array.isArray(values) || values.length <= period) return [];
      let gains = 0;
      let losses = 0;
      for (let i = 1; i <= period; i++) {
        const diff = values[i] - values[i - 1];
        if (diff >= 0) gains += diff; else losses += Math.abs(diff);
      }
      gains /= period;
      losses /= period;
      const rs = losses === 0 ? 0 : gains / losses;
      const rsiValues = [100 - 100 / (1 + rs)];
      for (let i = period + 1; i < values.length; i++) {
        const diff = values[i] - values[i - 1];
        if (diff >= 0) {
          gains = (gains * (period - 1) + diff) / period;
          losses = (losses * (period - 1)) / period;
        } else {
          gains = (gains * (period - 1)) / period;
          losses = (losses * (period - 1) + Math.abs(diff)) / period;
        }
        const rsNew = losses === 0 ? 0 : gains / losses;
        rsiValues.push(100 - 100 / (1 + rsNew));
      }
      return Array(period).fill(null).concat(rsiValues);
    }

        if (!response.ok) throw new Error(`Gemini ${response.status}`);
        const json = await response.json();

    function buildPromptForSymbol(symbol, data) {
      return `Actúa como analista financiero profesional. Genera un análisis integral para ${symbol} usando el siguiente contexto:
Precio actual: ${data?.price ?? 'desconocido'}
Cambio porcentual diario: ${data?.changesPercentage ?? 'desconocido'}
Últimas fechas: ${(data?.fullHistory || []).slice(0, 5).map(h => `${h.date}: ${h.close}`).join(', ')}

Responde en español con el siguiente formato de texto plano:
RECOMENDACION: (Compra/Venta/Mantener)
CONFIANZA: (Alta/Media/Baja)
TIPO: (Tendencial/Contrarian/Fundamental/...)
RESUMEN: (3-4 frases)
PLAN:
Entrada: valor
StopLoss: valor
TP1: valor
TP2: valor
RIESGOS: (lista corta)`;
    }

    function parseAiText(text) {
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const result = {
        recommendation: 'Sin Análisis',
        confidence: 'N/D',
        type: 'N/D',
        summary: '',
        plan: { entry: 'N/D', stopLoss: 'N/D', tp1: 'N/D', tp2: 'N/D' },
        risks: []
      };
      const planRegex = /^(Entrada|StopLoss|Stop-Loss|TP1|TP2)[:\s]+(.+)/i;
      lines.forEach(line => {
        if (line.toUpperCase().startsWith('RECOMEND')) {
          result.recommendation = line.split(':')[1]?.trim() ?? result.recommendation;
        } else if (line.toUpperCase().startsWith('CONFIAN')) {
          result.confidence = line.split(':')[1]?.trim() ?? result.confidence;
        } else if (line.toUpperCase().startsWith('TIPO')) {
          result.type = line.split(':')[1]?.trim() ?? result.type;
        } else if (line.toUpperCase().startsWith('RESUMEN')) {
          result.summary = line.substring(line.indexOf(':') + 1).trim();
        } else if (line.toUpperCase().startsWith('RIESGOS')) {
          const value = line.substring(line.indexOf(':') + 1).trim();
          result.risks = value.split(/[,;-]/).map(v => v.trim()).filter(Boolean);
        } else if (planRegex.test(line)) {
          const [, key, value] = line.match(planRegex);
          const normalized = key.toLowerCase();
          if (normalized.includes('entrada')) result.plan.entry = value.trim();
          if (normalized.includes('stop')) result.plan.stopLoss = value.trim();
          if (normalized.includes('tp1')) result.plan.tp1 = value.trim();
          if (normalized.includes('tp2')) result.plan.tp2 = value.trim();
        } else {
          if (result.summary) {
            result.summary += '\n' + line;
          } else {
            result.summary = line;
          }
        }
      });
      if (result.summary && result.risks.length) {
        result.summary += '\nRiesgos: ' + result.risks.join(', ');
      }
      return result;
    }

    function potencialGain(qty, targetStr, price) {
      const target = parseFloat(targetStr.replace(/[^0-9.]/g, ''));
      if (!target || !price) return 'Dato no disponible';
      const profit = (target - price) * qty;
      return `Potencial: ${formatterCurrency.format(profit)}`;
    }

    function potencialLoss(qty, stopStr, price) {
      const stop = parseFloat(stopStr.replace(/[^0-9.]/g, ''));
      if (!stop || !price) return 'Dato no disponible';
      const loss = (price - stop) * qty;
      return `Potencial: ${formatterCurrency.format(loss)}`;
    }

              ${['buy','hold','sell'].map(bucket => `
                <div class="bg-gray-900 border border-gray-700 rounded-lg p-4 space-y-3">
                  <h4 class="text-sm font-semibold ${bucket === 'buy' ? 'text-green-300' : bucket === 'hold' ? 'text-yellow-300' : 'text-red-300'}">${bucket === 'buy' ? 'Comprar' : bucket === 'hold' ? 'Mantener' : 'Vender'}</h4>
                  <div class="space-y-2">
                    ${report[bucket].length ? report[bucket].map(item => `
                      <div class="flex items-center justify-between gap-2 text-sm">
                        <div>
                          <p class="text-white font-semibold">${item.symbol}</p>
                          <p class="text-gray-400 text-xs">${item.name || ''}</p>
                        </div>
                        <button data-symbol="${item.symbol}" class="add-watch bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg px-2 py-1 text-xs">${appState.watchlist.includes(item.symbol) ? '✓' : '+'}</button>
                      </div>`).join('') : '<p class="text-xs text-gray-500">Sin recomendaciones</p>'}
                  </div>
                </div>`).join('')}
            </div>
          </div>`;
        const toggleBtn = item.querySelector('button');
        toggleBtn.addEventListener('click', () => {
          report.open = !report.open;
          renderReports();
        });
        list.appendChild(item);
      });

      container.appendChild(list);

      container.querySelectorAll('.view-report').forEach(btn => {
        btn.addEventListener('click', (event) => {
          const index = Number(event.target.dataset.index);
          openModal(appState.weeklyReports[index].rawText);
        });
      });

      container.querySelectorAll('.add-watch').forEach(btn => {
        btn.addEventListener('click', (event) => {
          const symbol = event.target.dataset.symbol;
          if (!appState.watchlist.includes(symbol)) {
            appState.watchlist.push(symbol);
            renderWatchlist();
            alert(symbol + ' agregado a la watchlist.');
          }
        });
      });
    }

    async function handleReportUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      loaders.reports = true;
      renderReports();
      try {
        const text = await extractTextFromPdf(file);
        const classified = classifyReportText(text);
        appState.weeklyReports.unshift({
          fileName: file.name,
          uploadedAt: new Date().toISOString(),
          rawText: text,
          open: true,
          ...classified
        });
      } catch (error) {
        alert('No se pudo procesar el PDF: ' + error.message);
      }
      loaders.reports = false;
      renderReports();
      event.target.value = '';
    }

    async function extractTextFromPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      return text;
    }

    function classifyReportText(text) {
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const result = { buy: [], hold: [], sell: [] };
      const tickerRegex = /\b[A-Z]{1,5}\b/g;
      lines.forEach(line => {
        const matches = line.match(tickerRegex);
        if (!matches) return;
        const lower = line.toLowerCase();
        const bucket = lower.includes('buy') || lower.includes('long') || lower.includes('bull') ? 'buy'
          : lower.includes('hold') || lower.includes('neutral') ? 'hold'
          : lower.includes('sell') || lower.includes('short') || lower.includes('bear') ? 'sell'
          : null;
        if (!bucket) return;
        matches.forEach(symbol => {
          if (!result[bucket].some(item => item.symbol === symbol)) {
            result[bucket].push({ symbol, name: inferName(symbol, line) });
          }
        });
      });
      return result;
    }

    function inferName(symbol, line) {
      const nameMatch = line.replace(symbol, '').trim();
      return nameMatch.length > 0 ? nameMatch : '';
    }

    function openModal(text) {
      document.getElementById('modal-content').textContent = text;
      document.getElementById('modal').classList.remove('hidden');
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (event) => {
      if (event.target.id === 'modal') closeModal();
    });
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
    function renderHistory() {
      const container = document.getElementById('view-history');
      container.innerHTML = '';

      container.innerHTML = '<h2 class="text-2xl text-white font-semibold">Historial de Análisis IA</h2>';

      const entries = Object.keys(appState.analysisHistory);
      if (entries.length === 0) {
        container.innerHTML += '<div class="bg-gray-800 border border-gray-700 rounded-lg p-6 text-center text-gray-400">Aún no hay análisis almacenados.</div>';
        return;
      }

      const list = document.createElement('div');
      list.className = 'mt-4 space-y-3';

      entries.forEach(symbol => {
        const analyses = appState.analysisHistory[symbol];
        const item = document.createElement('div');
        item.className = 'bg-gray-800 border border-gray-700 rounded-lg';
        const header = document.createElement('button');
        header.className = 'w-full flex items-center justify-between px-4 py-3 text-left text-white text-sm';
        header.innerHTML = `
          <span class="font-semibold">${symbol}</span>
          <span class="flex items-center gap-1">
            ${analyses.slice(0, 5).map(analysis => `<span class="inline-block w-2 h-2 rounded-full ${getRecommendationDotClass(analysis.recommendation)}"></span>`).join('')}
            <span class="text-gray-400">▼</span>
          </span>`;

        const body = document.createElement('div');
        body.className = 'collapse-content hidden border-t border-gray-700 p-4 text-sm space-y-2';
        body.innerHTML = `
          <div class="overflow-x-auto">
            <table class="min-w-full text-left text-xs">
              <thead class="text-gray-400 uppercase">
                <tr>
                  <th class="py-2 pr-3">Fecha</th>
                  <th class="py-2 pr-3">Recomendación</th>
                  <th class="py-2 pr-3">Confianza</th>
                  <th class="py-2 pr-3">Plan</th>
                  <th class="py-2">Detalles</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-700">
                ${analyses.map((analysis, idx) => `
                  <tr>
                    <td class="py-2 pr-3">${new Date(analysis.createdAt).toLocaleString()}</td>
                    <td class="py-2 pr-3 ${getRecommendationTextClass(analysis.recommendation)}">${analysis.recommendation}</td>
                    <td class="py-2 pr-3">${analysis.confidence}</td>
                    <td class="py-2 pr-3 text-xs">Entrada: ${analysis.plan.entry}<br>SL: ${analysis.plan.stopLoss}<br>TP1: ${analysis.plan.tp1}<br>TP2: ${analysis.plan.tp2}</td>
                    <td class="py-2">
                      <button data-symbol="${symbol}" data-index="${idx}" class="view-analysis bg-gray-700 hover:bg-gray-600 text-white rounded-lg px-2 py-1 text-xs">+</button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;

        header.addEventListener('click', () => {
          body.classList.toggle('hidden');
        });

        item.appendChild(header);
        item.appendChild(body);
        list.appendChild(item);
      });

      container.appendChild(list);

      container.querySelectorAll('.view-analysis').forEach(btn => {
        btn.addEventListener('click', (event) => {
          const symbol = event.target.dataset.symbol;
          const index = Number(event.target.dataset.index);
          const analysis = appState.analysisHistory[symbol][index];
          const text = `Símbolo: ${symbol}\nFecha: ${new Date(analysis.createdAt).toLocaleString()}\nRecomendación: ${analysis.recommendation}\nConfianza: ${analysis.confidence}\nTipo: ${analysis.type}\nResumen:\n${analysis.summary}\n\nPlan:\nEntrada: ${analysis.plan.entry}\nStop-Loss: ${analysis.plan.stopLoss}\nTP1: ${analysis.plan.tp1}\nTP2: ${analysis.plan.tp2}`;
          openModal(text);
        });
      });
    }

    function getRecommendationDotClass(rec) {
      switch ((rec || '').toLowerCase()) {
        case 'compra':
          return 'bg-green-400';
        case 'venta':
          return 'bg-red-400';
        case 'mantener':
          return 'bg-yellow-400';
        default:
          return 'bg-gray-500';
      }
    }

    function getRecommendationTextClass(rec) {
      switch ((rec || '').toLowerCase()) {
        case 'compra':
          return 'text-green-400';
        case 'venta':
          return 'text-red-400';
        case 'mantener':
          return 'text-yellow-400';
        default:
          return 'text-gray-300';
      }
    }

    renderAll();
  </script>
</body>
</html>
